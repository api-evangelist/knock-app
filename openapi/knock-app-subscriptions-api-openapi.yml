openapi: 3.2.0
info:
  title: Knock Subscriptions API
  version: '1.0'
  description: A subscription represents a connection between a recipient and an object, used to represent a list.
servers:
- url: https://api.knock.app
  variables: {}
security:
- BearerAuth: []
tags:
- description: A subscription represents a connection between a recipient and an object, used to represent a list.
  name: Subscriptions
paths:
  /v1/users/{user_id}/subscriptions:
    get:
      callbacks: {}
      description: Retrieves a paginated list of subscriptions for a specific user, in descending order.
      operationId: listSubscriptionsForUser
      parameters:
      - description: The user ID to list subscriptions for.
        in: path
        name: user_id
        required: true
        schema:
          type: string
      - description: Associated resources to include in the response.
        in: query
        name: include
        required: false
        schema:
          items:
            enum:
            - preferences
            type: string
          type: array
      - description: Only returns subscriptions for the specified object references.
        in: query
        name: objects[]
        required: false
        schema:
          items:
            $ref: '#/components/schemas/RecipientReference'
          type: array
      - description: The cursor to fetch entries after.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries before.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: The number of items per page (defaults to 50).
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSubscriptionsResponse'
          description: OK
      summary: List user subscriptions
      tags:
      - Subscriptions
      x-ratelimit-tier: 4
  /v1/objects/{collection}/{object_id}/subscriptions:
    delete:
      callbacks: {}
      description: Delete subscriptions for the specified recipients from an object. Returns the list of deleted subscriptions.
      operationId: deleteSubscriptionsForObject
      parameters:
      - description: Unique identifier for the object.
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: The collection this object belongs to.
        in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSubscriptionsRequest'
        description: Params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsResponse'
          description: OK
      summary: Delete subscriptions
      tags:
      - Subscriptions
      x-ratelimit-tier: 3
    get:
      callbacks: {}
      description: List subscriptions for an object. Either list the recipients that subscribe to the provided object, or list the objects that the provided object is subscribed to. Determined by the `mode` query parameter.
      operationId: listSubscriptionsForObject
      parameters:
      - description: Mode of the request. `recipient` to list the objects that the provided object is subscribed to, `object` to list the recipients that subscribe to the provided object.
        in: query
        name: mode
        required: false
        schema:
          default: object
          enum:
          - recipient
          - object
          type: string
      - description: Additional fields to include in the response.
        in: query
        name: include
        required: false
        schema:
          items:
            enum:
            - preferences
            type: string
          type: array
      - description: Recipients to filter by (only used if mode is `object`).
        in: query
        name: recipients[]
        required: false
        schema:
          items:
            $ref: '#/components/schemas/RecipientReference'
          type: array
      - description: Objects to filter by (only used if mode is `recipient`).
        in: query
        name: objects[]
        required: false
        schema:
          items:
            $ref: '#/components/schemas/ObjectReference'
          type: array
      - description: Unique identifier for the object.
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: The collection this object belongs to.
        in: path
        name: collection
        required: true
        schema:
          type: string
      - description: The cursor to fetch entries after.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries before.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: The number of items per page (defaults to 50).
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSubscriptionsResponse'
          description: OK
      summary: List subscriptions
      tags:
      - Subscriptions
      x-ratelimit-tier: 4
    post:
      callbacks: {}
      description: Add subscriptions for an object. If a subscription already exists, it will be updated. This endpoint also handles inline identifications for the `recipient`.
      operationId: addSubscriptionsForObject
      parameters:
      - description: Unique identifier for the object.
        in: path
        name: object_id
        required: true
        schema:
          type: string
      - description: The collection this object belongs to.
        in: path
        name: collection
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              properties:
                key: value
              recipients:
              - user_1
              - user_2
            schema:
              $ref: '#/components/schemas/UpsertSubscriptionsRequest'
        description: Params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsResponse'
          description: OK
      summary: Add subscriptions
      tags:
      - Subscriptions
      x-ratelimit-tier: 3
components:
  schemas:
    PreferenceSetChannelTypes:
      description: Channel type preferences.
      example:
        email: true
        sms:
          conditions:
          - argument: US
            operator: equal_to
            variable: recipient.country_code
      properties:
        chat:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        email:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        http:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        in_app_feed:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        push:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        sms:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
      title: PreferenceSetChannelTypes
      type: object
    OneSignalChannelDataPlayerIdsOnly:
      description: OneSignal channel data.
      example:
        player_ids:
        - 123e4567-e89b-12d3-a456-426614174000
      properties:
        player_ids:
          description: A list of OneSignal player IDs.
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          items:
            description: OneSignal player ID.
            format: uuid
            type: string
          type: array
      required:
      - player_ids
      title: OneSignalChannelDataPlayerIdsOnly
      type: object
    MsTeamsTokenConnection:
      description: Microsoft Teams token connection.
      example:
        knock_tenant_id: starfleet
        ms_teams_channel_id: 123e4567-e89b-12d3-a456-426614174000
        ms_teams_team_id: 123e4567-e89b-12d3-a456-426614174000
        ms_teams_tenant_id: null
        ms_teams_user_id: null
      properties:
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
        ms_teams_channel_id:
          description: Microsoft Teams channel ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_team_id:
          description: Microsoft Teams team ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_tenant_id:
          description: Microsoft Teams tenant ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_user_id:
          description: Microsoft Teams user ID.
          format: uuid
          type:
          - string
          - 'null'
      title: MsTeamsTokenConnection
      type: object
    RecipientRequest:
      description: Specifies a recipient in a request. This can either be a user identifier (string), an inline user request (object), or an inline object request, which is determined by the presence of a `collection` property.
      example:
        id: user_1
      oneOf:
      - description: The ID of the user which is used as the reference for the recipient.
        example: user_123
        title: UserRecipient
        type: string
      - $ref: '#/components/schemas/InlineIdentifyUserRequest'
      - $ref: '#/components/schemas/InlineIdentifyObjectRequest'
      title: RecipientRequest
    PushChannelDataTokensOnly:
      description: Push channel data.
      example:
        tokens:
        - push_token_1
        - push_token_2
      properties:
        tokens:
          description: A list of push channel tokens.
          items:
            description: The device token to send the push notification to.
            type: string
          type: array
      required:
      - tokens
      title: PushChannelDataTokensOnly
      type: object
    SlackIncomingWebhookConnection:
      description: A Slack connection incoming webhook.
      example:
        incoming_webhook:
          url: https://hooks.slack.com/services/T01234567890/B01234567890/1234567890
        knock_tenant_id: starfleet
      properties:
        incoming_webhook:
          description: A Slack connection incoming webhook.
          properties:
            url:
              description: The URL of the incoming webhook for a Slack connection.
              example: https://hooks.slack.com/services/T01234567890/B01234567890/1234567890
              type: string
          required:
          - url
          type: object
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
      required:
      - incoming_webhook
      title: SlackIncomingWebhookConnection
      type: object
    DiscordChannelData:
      description: Discord channel data.
      example:
        connections:
        - channel_id: '123456789012345678'
          knock_tenant_id: starfleet
      properties:
        connections:
          description: List of Discord channel connections.
          items:
            description: Discord channel connection, either a channel connection or an incoming webhook connection.
            oneOf:
            - $ref: '#/components/schemas/DiscordChannelConnection'
            - $ref: '#/components/schemas/DiscordIncomingWebhookConnection'
            type: object
          type: array
      required:
      - connections
      title: DiscordChannelData
      type: object
    Recipient:
      description: A recipient of a notification, which is either a user or an object.
      example:
        __typename: User
        avatar: null
        created_at: null
        email: jane@ingen.net
        id: jane
        name: Jane Doe
        phone_number: null
        timezone: null
        updated_at: '2024-05-22T12:00:00Z'
      oneOf:
      - $ref: '#/components/schemas/User'
      - $ref: '#/components/schemas/Object'
      title: Recipient
      type: object
    ObjectReference:
      description: A reference to a recipient object.
      example:
        collection: projects
        id: project_123
      properties:
        collection:
          description: The collection the recipient object belongs to.
          example: projects
          type: string
        id:
          description: An identifier for the recipient object.
          example: project_123
          type: string
      title: ObjectReference
      type: object
    InlineIdentifyUserRequest:
      additionalProperties: true
      description: A set of parameters to inline-identify a user with. Inline identifying the user will ensure that the user is available before the request is executed in Knock. It will perform an upsert for the user you're supplying, replacing any properties specified.
      example:
        channel_data:
          97c5837d-c65c-4d54-aa39-080eeb81c69d:
            tokens:
            - push_token_123
        email: jane@ingen.net
        id: user_1
        name: Jane Doe
        preferences:
          default:
            channel_types:
              email: true
            workflows:
              dinosaurs-loose:
                channel_types:
                  email: true
        timezone: America/New_York
      properties:
        avatar:
          description: A URL for the avatar of the user.
          type:
          - string
          - 'null'
        channel_data:
          allOf:
          - $ref: '#/components/schemas/InlineChannelDataRequest'
          description: Channel-specific information that's needed to deliver a notification to an end provider.
        created_at:
          description: The creation date of the user from your system.
          format: date-time
          type:
          - string
          - 'null'
        email:
          description: The primary email address for the user.
          type:
          - string
          - 'null'
        id:
          description: The unique identifier of the user.
          type: string
        locale:
          description: The locale of the user. Used for [message localization](/concepts/translations).
          type:
          - string
          - 'null'
        name:
          description: Display name of the user.
          type:
          - string
          - 'null'
        phone_number:
          description: The [E.164](https://www.twilio.com/docs/glossary/what-e164) phone number of the user (required for SMS channels).
          type:
          - string
          - 'null'
        preferences:
          allOf:
          - $ref: '#/components/schemas/InlinePreferenceSetRequest'
          description: A set of preferences for the user.
        timezone:
          description: The timezone of the user. Must be a valid [tz database time zone string](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones). Used for [recurring schedules](/concepts/schedules#scheduling-workflows-with-recurring-schedules-for-recipients).
          type:
          - string
          - 'null'
      required:
      - id
      title: InlineIdentifyUserRequest
      type: object
    RecipientReference:
      description: A reference to a recipient, either a user identifier (string) or an object reference (ID, collection).
      example: user_123
      oneOf:
      - description: The ID of the user which is used as the reference for the recipient.
        example: user_123
        title: UserReference
        type: string
      - description: A reference to a recipient object.
        example:
          collection: projects
          id: project_123
        properties:
          collection:
            description: The collection the recipient object belongs to.
            example: projects
            type: string
          id:
            description: An identifier for the recipient object.
            example: project_123
            type: string
        title: ObjectReference
        type: object
      title: RecipientReference
    PreferenceSetChannelTypeSetting:
      description: A set of settings for a channel type. Currently, this can only be a list of conditions to apply.
      example:
        conditions:
        - argument: US
          operator: equal_to
          variable: recipient.country_code
      properties:
        conditions:
          description: A list of conditions to apply to a channel type.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
      required:
      - conditions
      title: PreferenceSetChannelTypeSetting
      type: object
    PreferenceSetWorkflowCategorySetting:
      description: Workflow or category preferences within a preference set
      example:
        channel_types:
          email: false
        channels:
          aef6e715-df82-4ab6-b61e-b743e249f7b6: true
      oneOf:
      - example: false
        type: boolean
      - description: The settings object for a workflow or category, where you can specify channel types or conditions.
        example:
          channel_types:
            email: false
          channels:
            aef6e715-df82-4ab6-b61e-b743e249f7b6: true
          conditions: null
        properties:
          channel_types:
            anyOf:
            - $ref: '#/components/schemas/PreferenceSetChannelTypes'
            - {}
            description: An object where the key is the channel type and the values are the preference settings for that channel type.
          channels:
            anyOf:
            - $ref: '#/components/schemas/PreferenceSetChannels'
            - {}
            description: An object where the key is the channel ID and the values are the preference settings for that channel ID.
          conditions:
            description: A list of conditions to apply to a channel type.
            items:
              $ref: '#/components/schemas/Condition'
            type:
            - array
            - 'null'
        title: PreferenceSetWorkflowCategorySettingObject
        type: object
      title: PreferenceSetWorkflowCategorySetting
      type: object
    InlinePreferenceSetRequest:
      additionalProperties:
        $ref: '#/components/schemas/PreferenceSetRequest'
      description: Inline set preferences for a recipient, where the key is the preference set id. Preferences that are set inline will be merged into any existing preferences rather than replacing them.
      example:
        default:
          categories:
            transactional:
              channel_types:
                email: false
          channel_types:
            email: true
      title: InlinePreferenceSetRequest
      type: object
    DeleteSubscriptionsRequest:
      description: A request to delete subscriptions for a set of recipients.
      example:
        recipients:
        - user_123
      properties:
        recipients:
          description: The recipients of the subscription. You can subscribe up to 100 recipients to an object at a time.
          items:
            $ref: '#/components/schemas/RecipientReference'
          type: array
      required:
      - recipients
      title: DeleteSubscriptionsRequest
      type: object
    MsTeamsIncomingWebhookConnection:
      description: Microsoft Teams incoming webhook connection.
      example:
        incoming_webhook:
          url: https://example.com/webhook
        knock_tenant_id: starfleet
      properties:
        incoming_webhook:
          description: Microsoft Teams incoming webhook.
          properties:
            url:
              description: Microsoft Teams incoming webhook URL.
              example: https://example.com/webhook
              type: string
          required:
          - url
          type: object
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
      required:
      - incoming_webhook
      title: MsTeamsIncomingWebhookConnection
      type: object
    PreferenceSetRequest:
      description: A request to set a preference set for a recipient.
      example:
        __persistence_strategy__: merge
        categories:
          marketing: false
          transactional:
            channel_types:
              email: false
        channel_types:
          email: true
        channels:
          2f641633-95d3-4555-9222-9f1eb7888a80:
            conditions:
            - argument: US
              operator: equal_to
              variable: recipient.country_code
          aef6e715-df82-4ab6-b61e-b743e249f7b6: true
        commercial_subscribed: true
        workflows:
          dinosaurs-loose:
            channel_types:
              email: false
      properties:
        __persistence_strategy__:
          description: Controls how the preference set is persisted. 'replace' will completely replace the preference set, 'merge' will merge with existing preferences.
          enum:
          - merge
          - replace
          type: string
        categories:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PreferenceSetWorkflowCategorySetting'
            description: An object where the key is the category and the values are the preference settings for that category.
            example:
              marketing:
                channel_types:
                  email: false
              transactional: true
            title: PreferenceSetRequestCategories
            type: object
          - {}
          description: An object where the key is the category and the values are the preference settings for that category.
        channel_types:
          anyOf:
          - $ref: '#/components/schemas/PreferenceSetChannelTypes'
          - {}
          description: An object where the key is the channel type and the values are the preference settings for that channel type.
        channels:
          anyOf:
          - $ref: '#/components/schemas/PreferenceSetChannels'
          - {}
          description: An object where the key is the channel ID and the values are the preference settings for that channel ID.
        commercial_subscribed:
          anyOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetCommercialSubscribedSetting'
          - {}
          description: Whether the recipient is subscribed to commercial communications. When false, the recipient will not receive commercial workflow notifications. Can also be set to a settings object with conditions that are evaluated at notification send time.
        workflows:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PreferenceSetWorkflowCategorySetting'
            description: An object where the key is the workflow key and the values are the preference settings for that workflow.
            example:
              dinosaurs-loose:
                channel_types:
                  email: false
                  sms: true
              welcome-sequence: true
            title: PreferenceSetRequestWorkflows
            type: object
          - {}
          description: An object where the key is the workflow key and the values are the preference settings for that workflow.
      title: PreferenceSetRequest
      type: object
    UpsertSubscriptionsRequest:
      description: A request to upsert subscriptions for a set of recipients.
      example:
        properties:
          key: value
        recipients:
        - user_1
        - user_2
      properties:
        properties:
          additionalProperties: true
          description: The custom properties associated with the subscription relationship.
          type:
          - object
          - 'null'
        recipients:
          description: The recipients of the subscription. You can subscribe up to 100 recipients to an object at a time.
          items:
            $ref: '#/components/schemas/RecipientRequest'
          type: array
      required:
      - recipients
      title: UpsertSubscriptionsRequest
      type: object
    ListSubscriptionsResponse:
      description: A response containing a list of subscriptions.
      example:
        entries:
        - __typename: Subscription
          inserted_at: '2021-01-01T00:00:00Z'
          object:
            __typename: Object
            collection: assets
            created_at: null
            id: specimen_25
            properties:
              classification: Theropod
              config:
                biz: baz
                foo: bar
              name: Velociraptor
              status: contained
            updated_at: '2024-05-22T12:00:00Z'
          recipient:
            __typename: User
            avatar: null
            created_at: null
            email: jane@ingen.net
            id: jane
            name: Jane Doe
            phone_number: null
            timezone: null
            updated_at: '2024-05-22T12:00:00Z'
          updated_at: '2021-01-01T00:00:00Z'
        page_info:
          __typename: PageInfo
          after: null
          before: null
          page_size: 25
      properties:
        entries:
          description: A list of subscriptions.
          items:
            $ref: '#/components/schemas/Subscription'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - entries
      - page_info
      title: ListSubscriptionsResponse
      type: object
    InlineChannelDataRequest:
      additionalProperties:
        description: Channel data for a given channel type.
        oneOf:
        - $ref: '#/components/schemas/PushChannelDataTokensOnly'
        - $ref: '#/components/schemas/PushChannelDataDevicesOnly'
        - $ref: '#/components/schemas/AWSSNSPushChannelDataTargetARNsOnly'
        - $ref: '#/components/schemas/AWSSNSPushChannelDataDevicesOnly'
        - $ref: '#/components/schemas/OneSignalChannelDataPlayerIdsOnly'
        - $ref: '#/components/schemas/SlackChannelData'
        - $ref: '#/components/schemas/MsTeamsChannelData'
        - $ref: '#/components/schemas/DiscordChannelData'
      description: A request to set channel data for a type of channel inline.
      example:
        97c5837d-c65c-4d54-aa39-080eeb81c69d:
          tokens:
          - push_token_xxx
      title: InlineChannelDataRequest
      type: object
    PreferenceSetChannelSetting:
      description: A set of settings for a specific channel. Currently, this can only be a list of conditions to apply.
      example:
        conditions:
        - argument: US
          operator: equal_to
          variable: recipient.country_code
      properties:
        conditions:
          description: A list of conditions to apply to a specific channel.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
      required:
      - conditions
      title: PreferenceSetChannelSetting
      type: object
    PreferenceSetCommercialSubscribedSetting:
      description: A set of settings for the commercial subscribed preference. Currently, this can only be a list of conditions to apply.
      example:
        conditions:
        - argument: 'false'
          operator: not_equal_to
          variable: tenant.settings.preferences.commercial_subscribed
      properties:
        conditions:
          description: A list of conditions to apply to the commercial subscribed preference.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
      required:
      - conditions
      title: PreferenceSetCommercialSubscribedSetting
      type: object
    SubscriptionsResponse:
      description: A response containing a list of subscriptions.
      example:
      - __typename: Subscription
        inserted_at: '2021-01-01T00:00:00Z'
        object:
          __typename: Object
          collection: assets
          created_at: null
          id: specimen_25
          properties:
            classification: Theropod
            config:
              biz: baz
              foo: bar
            name: Velociraptor
            status: contained
