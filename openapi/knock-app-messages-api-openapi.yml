openapi: 3.2.0
info:
  title: Knock Messages API
  version: '1.0'
  description: A message sent to a single recipient on a channel.
servers:
- url: https://api.knock.app
  variables: {}
security:
- BearerAuth: []
tags:
- description: A message sent to a single recipient on a channel.
  name: Messages
paths:
  /v1/messages:
    get:
      callbacks: {}
      description: Returns a paginated list of messages for the current environment.
      operationId: listMessages
      parameters:
      - description: The cursor to fetch entries after.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries before.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: The number of items per page (defaults to 50).
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      - description: Limits the results to items with the corresponding tenant.
        example: tenant_123
        in: query
        name: tenant
        required: false
        schema:
          type: string
      - description: Limits the results to items with the corresponding channel ID.
        example: 123e4567-e89b-12d3-a456-426614174000
        in: query
        name: channel_id
        required: false
        schema:
          type: string
      - description: Limits the results to messages with the given delivery status.
        example:
        - delivered
        in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - queued
            - sent
            - delivered
            - delivery_attempted
            - undelivered
            - not_sent
            - bounced
            type: string
          type: array
      - description: Limits the results to messages with the given engagement status.
        example:
        - unread
        in: query
        name: engagement_status
        required: false
        schema:
          items:
            enum:
            - seen
            - unseen
            - read
            - unread
            - archived
            - unarchived
            - link_clicked
            - interacted
            type: string
          type: array
      - description: 'Limits the results to only the message IDs given (max 50). Note: when using this option, the results will be subject to any other filters applied to the query.'
        example:
        - 1jNaXzB2RZX3LY8wVQnfCKyPnv7
        in: query
        name: message_ids
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Limits the results to messages related to any of the provided categories.
        example:
        - workflow_123
        in: query
        name: workflow_categories
        required: false
        schema:
          items:
            type: string
          type: array
      - description: Limits the results to messages triggered by the given workflow key.
        example: comment-created
        in: query
        name: source
        required: false
        schema:
          type: string
      - description: Limits the results to messages associated with the top-level workflow run ID returned by the workflow trigger request.
        example: 123e4567-e89b-12d3-a456-426614174000
        in: query
        name: workflow_run_id
        required: false
        schema:
          format: uuid
          type: string
      - description: Limits the results to messages for a specific recipient's workflow run.
        example: 123e4567-e89b-12d3-a456-426614174000
        in: query
        name: workflow_recipient_run_id
        required: false
        schema:
          format: uuid
          type: string
      - description: Limits the results to only messages that were generated with the given data. See [trigger data filtering](/api-reference/overview/trigger-data-filtering) for more information.
        example: '{"comment_id": "123"}'
        in: query
        name: trigger_data
        required: false
        schema:
          type: string
      - description: Limits the results to items inserted after the given date.
        example: '2025-01-01T00:00:00Z'
        in: query
        name: inserted_at.gt
        required: false
        schema:
          type: string
      - description: Limits the results to items inserted after or on the given date.
        example: '2025-01-01T00:00:00Z'
        in: query
        name: inserted_at.gte
        required: false
        schema:
          type: string
      - description: Limits the results to items inserted before the given date.
        example: '2025-01-01T00:00:00Z'
        in: query
        name: inserted_at.lt
        required: false
        schema:
          type: string
      - description: Limits the results to items inserted before or on the given date.
        example: '2025-01-01T00:00:00Z'
        in: query
        name: inserted_at.lte
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMessagesResponse'
          description: OK
      summary: List messages
      tags:
      - Messages
      x-ratelimit-tier: 4
      x-retention-policy: true
  /v1/messages/{message_id}/interacted:
    put:
      callbacks: {}
      description: Marks a message as `interacted` with by the user. This can include any user action on the message, with optional metadata about the specific interaction. Cannot include more than 5 key-value pairs, must not contain nested data. Read more about message engagement statuses here.
      operationId: markMessageInteracted
      parameters:
      - description: The unique identifier for the message.
        example: 1jNaXzB2RZX3LY8wVQnfCKyPnv7
        in: path
        name: message_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInteractedRequest'
        description: Params
        required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Message'
                example:
                  __typename: Message
                  actors:
                  - user_123
                  archived_at: null
                  channel_id: 123e4567-e89b-12d3-a456-426614174000
                  clicked_at: null
                  data:
                    foo: bar
                  engagement_statuses:
                  - seen
                  - interacted
                  id: 1jNaXzB2RZX3LY8wVQnfCKyPnv7
                  inserted_at: '2021-01-01T00:00:00Z'
                  interacted_at: '2025-01-01T00:03:00Z'
                  link_clicked_at: null
                  metadata:
                    external_id: 123e4567-e89b-12d3-a456-426614174000
                  read_at: null
                  recipient: user_123
                  scheduled_at: null
                  seen_at: '2025-01-01T00:01:00Z'
                  source:
                    __typename: NotificationSource
                    categories:
                    - collaboration
                    key: comment-created
                    step_ref: email_step_1
                    version_id: 123e4567-e89b-12d3-a456-426614174000
                  status: sent
                  tenant: tenant_123
                  updated_at: '2021-01-01T00:00:00Z'
                  workflow: comment-created
          description: OK
      summary: Mark message as interacted
      tags:
      - Messages
      x-ratelimit-tier: 2
      x-retention-policy: true
  /v1/messages/{message_id}/events:
    get:
      callbacks: {}
      description: Returns a paginated list of events for the specified message.
      operationId: listMessageEvents
      parameters:
      - description: The ID of the message to fetch events for.
        in: path
        name: message_id
        required: true
        schema:
          type: string
      - description: The cursor to fetch entries after.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries before.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: The number of items per page (defaults to 50).
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMessageEventsResponse'
          description: OK
      summary: List events
      tags:
      - Messages
      x-ratelimit-tier: 3
      x-retention-policy: true
  /v1/users/{user_id}/messages:
    get:
      callbacks: {}
