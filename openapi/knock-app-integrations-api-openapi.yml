openapi: 3.2.0
info:
  title: Knock Integrations API
  version: '1.0'
servers:
- url: https://api.knock.app
  variables: {}
security:
- BearerAuth: []
tags:
- name: Integrations
paths:
  /v1/integrations/census/custom-destination:
    post:
      callbacks: {}
      description: Processes a Census custom destination RPC request.
      operationId: processCensusRpcRequest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: The unique identifier for the RPC request.
                  type: string
                jsonrpc:
                  description: The JSON-RPC version.
                  type: string
                method:
                  description: The method name to execute.
                  type: string
                params:
                  additionalProperties: true
                  description: The parameters for the method.
                  type: object
              required:
              - id
              - method
              - jsonrpc
              type: object
        description: Params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: The request ID.
                    type: string
                  result:
                    additionalProperties: true
                    description: The result of the RPC call.
                    type: object
                type: object
          description: OK
      summary: Process a Census RPC request
      tags:
      - Integrations
      x-ratelimit-tier: 3
  /v1/integrations/hightouch/embedded-destination:
    post:
      callbacks: {}
      description: Processes a Hightouch embedded destination RPC request.
      operationId: processHightouchRpcRequest
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              properties:
                id:
                  description: The unique identifier for the RPC request.
                  type: string
                jsonrpc:
                  description: The JSON-RPC version.
                  type: string
                method:
                  description: The method name to execute.
                  type: string
                params:
                  additionalProperties: true
                  description: The parameters for the method.
                  type: object
              required:
              - id
              - method
              - jsonrpc
              type: object
        description: Params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  id:
                    description: The request ID.
                    type: string
                  result:
                    additionalProperties: true
                    description: The result of the RPC call.
                    type: object
                type: object
          description: OK
      summary: Process a Hightouch RPC request
      tags:
      - Integrations
      x-ratelimit-tier: 3
components:
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
