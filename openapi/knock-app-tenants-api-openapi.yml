openapi: 3.2.0
info:
  title: Knock Tenants API
  version: '1.0'
  description: A tenant represents a top-level entity from your system, like a company, organization, account, or workspace.
servers:
- url: https://api.knock.app
  variables: {}
security:
- BearerAuth: []
tags:
- description: A tenant represents a top-level entity from your system, like a company, organization, account, or workspace.
  name: Tenants
paths:
  /v1/tenants:
    get:
      callbacks: {}
      description: List tenants for the current environment.
      operationId: listTenants
      parameters:
      - description: Filter tenants by ID.
        in: query
        name: tenant_id
        required: false
        schema:
          type: string
      - description: Filter tenants by name.
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries after.
        in: query
        name: after
        required: false
        schema:
          type: string
      - description: The cursor to fetch entries before.
        in: query
        name: before
        required: false
        schema:
          type: string
      - description: The number of items per page (defaults to 50).
        in: query
        name: page_size
        required: false
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTenantsResponse'
          description: OK
      summary: List tenants
      tags:
      - Tenants
      x-ratelimit-tier: 4
  /v1/tenants/bulk/set:
    post:
      callbacks: {}
      description: Set or update up to 1,000 tenants in a single operation.
      operationId: bulkSetTenants
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              tenants:
              - id: tenant_1
                name: Acme Corp, Inc.
            schema:
              $ref: '#/components/schemas/BulkSetTenantsRequest'
        description: Params
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperation'
          description: OK
      summary: Bulk set tenants
      tags:
      - Tenants
      x-ratelimit-tier: 1
  /v1/tenants/bulk/delete:
    post:
      callbacks: {}
      description: Delete up to 1,000 tenants at a time in a single operation. This operation cannot be undone.
      operationId: bulkDeleteTenants
      parameters:
      - description: The IDs of the tenants to delete.
        in: query
        name: tenant_ids
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperation'
          description: OK
      summary: Bulk delete tenants
      tags:
      - Tenants
      x-ratelimit-tier: 1
  /v1/tenants/{id}:
    delete:
      callbacks: {}
      description: Delete a tenant and all associated data. This operation cannot be undone.
      operationId: deleteTenant
      parameters:
      - description: The unique identifier for the tenant.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      summary: Delete a tenant
      tags:
      - Tenants
      x-ratelimit-tier: 2
    get:
      callbacks: {}
      description: Get a tenant by ID.
      operationId: getTenant
      parameters:
      - description: The unique identifier for the tenant.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: When true, merges environment-level default preferences into the tenant's `settings.preference_set` field before returning the response. Defaults to false.
        in: query
        name: resolve_full_preference_settings
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: OK
      summary: Get a tenant
      tags:
      - Tenants
      x-ratelimit-tier: 4
    put:
      callbacks: {}
      description: Sets a tenant within an environment, performing an upsert operation. Any existing properties will be merged with the incoming properties.
      operationId: setTenant
      parameters:
      - description: The unique identifier for the tenant.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: When true, merges environment-level default preferences into the tenant's `settings.preference_set` field before returning the response. Defaults to false.
        in: query
        name: resolve_full_preference_settings
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            example:
              name: Jurassic Park
              settings:
                branding:
                  icon_url: https://example.com/trex_silhouette_icon.png
                  logo_url: https://example.com/amber_fossil_logo.png
                  primary_color: '#DF1A22'
                  primary_color_contrast: '#FFDE00'
            schema:
              $ref: '#/components/schemas/SetTenantRequest'
        description: Tenant
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetTenantResponse'
          description: OK
      summary: Set a tenant
      tags:
      - Tenants
      x-ratelimit-tier: 3
components:
  schemas:
    PreferenceSetChannelTypes:
      description: Channel type preferences.
      example:
        email: true
        sms:
          conditions:
          - argument: US
            operator: equal_to
            variable: recipient.country_code
      properties:
        chat:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        email:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        http:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        in_app_feed:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        push:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
        sms:
          description: Whether the channel type is enabled for the preference set.
          oneOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetChannelTypeSetting'
      title: PreferenceSetChannelTypes
      type: object
    OneSignalChannelDataPlayerIdsOnly:
      description: OneSignal channel data.
      example:
        player_ids:
        - 123e4567-e89b-12d3-a456-426614174000
      properties:
        player_ids:
          description: A list of OneSignal player IDs.
          example:
          - 123e4567-e89b-12d3-a456-426614174000
          items:
            description: OneSignal player ID.
            format: uuid
            type: string
          type: array
      required:
      - player_ids
      title: OneSignalChannelDataPlayerIdsOnly
      type: object
    MsTeamsTokenConnection:
      description: Microsoft Teams token connection.
      example:
        knock_tenant_id: starfleet
        ms_teams_channel_id: 123e4567-e89b-12d3-a456-426614174000
        ms_teams_team_id: 123e4567-e89b-12d3-a456-426614174000
        ms_teams_tenant_id: null
        ms_teams_user_id: null
      properties:
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
        ms_teams_channel_id:
          description: Microsoft Teams channel ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_team_id:
          description: Microsoft Teams team ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_tenant_id:
          description: Microsoft Teams tenant ID.
          format: uuid
          type:
          - string
          - 'null'
        ms_teams_user_id:
          description: Microsoft Teams user ID.
          format: uuid
          type:
          - string
          - 'null'
      title: MsTeamsTokenConnection
      type: object
    PushChannelDataTokensOnly:
      description: Push channel data.
      example:
        tokens:
        - push_token_1
        - push_token_2
      properties:
        tokens:
          description: A list of push channel tokens.
          items:
            description: The device token to send the push notification to.
            type: string
          type: array
      required:
      - tokens
      title: PushChannelDataTokensOnly
      type: object
    SlackIncomingWebhookConnection:
      description: A Slack connection incoming webhook.
      example:
        incoming_webhook:
          url: https://hooks.slack.com/services/T01234567890/B01234567890/1234567890
        knock_tenant_id: starfleet
      properties:
        incoming_webhook:
          description: A Slack connection incoming webhook.
          properties:
            url:
              description: The URL of the incoming webhook for a Slack connection.
              example: https://hooks.slack.com/services/T01234567890/B01234567890/1234567890
              type: string
          required:
          - url
          type: object
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
      required:
      - incoming_webhook
      title: SlackIncomingWebhookConnection
      type: object
    DiscordChannelData:
      description: Discord channel data.
      example:
        connections:
        - channel_id: '123456789012345678'
          knock_tenant_id: starfleet
      properties:
        connections:
          description: List of Discord channel connections.
          items:
            description: Discord channel connection, either a channel connection or an incoming webhook connection.
            oneOf:
            - $ref: '#/components/schemas/DiscordChannelConnection'
            - $ref: '#/components/schemas/DiscordIncomingWebhookConnection'
            type: object
          type: array
      required:
      - connections
      title: DiscordChannelData
      type: object
    BulkSetTenantsRequest:
      description: A request to set tenants in bulk.
      example:
        tenants:
        - id: tenant_1
          name: Acme Corp, Inc.
      properties:
        tenants:
          description: The tenants to be upserted.
          items:
            $ref: '#/components/schemas/InlineTenantRequest'
          type: array
      required:
      - tenants
      title: BulkSetTenantsRequest
      type: object
    SetTenantRequest:
      additionalProperties: true
      description: A tenant to be set in the system. You can supply any additional properties on the tenant object.
      example:
        name: Jurassic Park
        settings:
          branding:
            icon_url: https://example.com/trex_silhouette_icon.png
            logo_url: https://example.com/amber_fossil_logo.png
            primary_color: '#DF1A22'
            primary_color_contrast: '#FFDE00'
      properties:
        channel_data:
          description: The channel data for the tenant.
          oneOf:
          - {}
          - $ref: '#/components/schemas/InlineChannelDataRequest'
        name:
          description: An optional name for the tenant.
          type:
          - string
          - 'null'
        settings:
          description: The settings for the tenant. Includes branding and preference set.
          properties:
            branding:
              description: The branding for the tenant.
              properties:
                icon_url:
                  description: The icon URL for the tenant. Must point to a valid image with an image MIME type.
                  type:
                  - string
                  - 'null'
                logo_url:
                  description: The logo URL for the tenant. Must point to a valid image with an image MIME type.
                  type:
                  - string
                  - 'null'
                primary_color:
                  description: The primary color for the tenant, provided as a hex value.
                  type:
                  - string
                  - 'null'
                primary_color_contrast:
                  description: The primary color contrast for the tenant, provided as a hex value.
                  type:
                  - string
                  - 'null'
              type: object
            preference_set:
              description: The preference set for the tenant. Used to override the default preference set.
              oneOf:
              - {}
              - $ref: '#/components/schemas/PreferenceSetRequest'
          type: object
      title: SetTenantRequest
      type: object
    PreferenceSetChannelTypeSetting:
      description: A set of settings for a channel type. Currently, this can only be a list of conditions to apply.
      example:
        conditions:
        - argument: US
          operator: equal_to
          variable: recipient.country_code
      properties:
        conditions:
          description: A list of conditions to apply to a channel type.
          items:
            $ref: '#/components/schemas/Condition'
          type: array
      required:
      - conditions
      title: PreferenceSetChannelTypeSetting
      type: object
    TenantRequest:
      additionalProperties: true
      description: A tenant to be set in the system. You can supply any additional properties on the tenant object.
      example:
        id: tenant_123
        name: ACME Corp, Inc.
        settings:
          branding:
            dark_icon_url: https://example.com/icon_dark.png
            dark_logo_url: https://example.com/logo_dark.png
            dark_primary_color: '#FFFFFF'
            dark_primary_color_contrast: '#000000'
            icon_url: https://example.com/icon.png
            logo_url: https://example.com/logo.png
            primary_color: '#000000'
            primary_color_contrast: '#FFFFFF'
      properties:
        channel_data:
          description: The channel data for the tenant.
          oneOf:
          - {}
          - $ref: '#/components/schemas/InlineChannelDataRequest'
        id:
          description: The unique identifier for the tenant.
          type: string
        name:
          description: An optional name for the tenant.
          type:
          - string
          - 'null'
        preferences:
          description: The preferences for the tenant.
          oneOf:
          - {}
          - $ref: '#/components/schemas/InlinePreferenceSetRequest'
        settings:
          description: The settings for the tenant. Includes branding and preference set.
          properties:
            branding:
              description: The branding for the tenant.
              properties:
                dark_icon_url:
                  description: The icon URL for the tenant in dark mode. Falls back to `icon_url` if unset.
                  type:
                  - string
                  - 'null'
                dark_logo_url:
                  description: The logo URL for the tenant in dark mode. Falls back to `logo_url` if unset.
                  type:
                  - string
                  - 'null'
                dark_primary_color:
                  description: The primary color for the tenant in dark mode, provided as a hex value. Defaults to `#FFFFFF`.
                  type:
                  - string
                  - 'null'
                dark_primary_color_contrast:
                  description: The primary color contrast for the tenant in dark mode, provided as a hex value. Defaults to `#000000`.
                  type:
                  - string
                  - 'null'
                icon_url:
                  description: The icon URL for the tenant. Must point to a valid image with an image MIME type.
                  type:
                  - string
                  - 'null'
                logo_url:
                  description: The logo URL for the tenant. Must point to a valid image with an image MIME type.
                  type:
                  - string
                  - 'null'
                primary_color:
                  description: The primary color for the tenant, provided as a hex value.
                  type:
                  - string
                  - 'null'
                primary_color_contrast:
                  description: The primary color contrast for the tenant, provided as a hex value.
                  type:
                  - string
                  - 'null'
              type: object
            preference_set:
              description: The preference set for the tenant. Used to override the default preference set.
              oneOf:
              - {}
              - $ref: '#/components/schemas/PreferenceSetRequest'
          type: object
      required:
      - id
      title: TenantRequest
      type: object
    PreferenceSetWorkflowCategorySetting:
      description: Workflow or category preferences within a preference set
      example:
        channel_types:
          email: false
        channels:
          aef6e715-df82-4ab6-b61e-b743e249f7b6: true
      oneOf:
      - example: false
        type: boolean
      - description: The settings object for a workflow or category, where you can specify channel types or conditions.
        example:
          channel_types:
            email: false
          channels:
            aef6e715-df82-4ab6-b61e-b743e249f7b6: true
          conditions: null
        properties:
          channel_types:
            anyOf:
            - $ref: '#/components/schemas/PreferenceSetChannelTypes'
            - {}
            description: An object where the key is the channel type and the values are the preference settings for that channel type.
          channels:
            anyOf:
            - $ref: '#/components/schemas/PreferenceSetChannels'
            - {}
            description: An object where the key is the channel ID and the values are the preference settings for that channel ID.
          conditions:
            description: A list of conditions to apply to a channel type.
            items:
              $ref: '#/components/schemas/Condition'
            type:
            - array
            - 'null'
        title: PreferenceSetWorkflowCategorySettingObject
        type: object
      title: PreferenceSetWorkflowCategorySetting
      type: object
    SetTenantResponse:
      description: The response from setting a tenant.
      example:
        __typename: Tenant
        created_at: '1993-05-24T08:30:00Z'
        id: ingen_isla_nublar
        name: Jurassic Park
        settings:
          branding:
            icon_url: https://example.com/trex_silhouette_icon.png
            logo_url: https://example.com/amber_fossil_logo.png
            primary_color: '#DF1A22'
            primary_color_contrast: '#FFDE00'
        updated_at: '1993-06-11T15:45:00Z'
      oneOf:
      - $ref: '#/components/schemas/Tenant'
      title: SetTenantResponse
    InlinePreferenceSetRequest:
      additionalProperties:
        $ref: '#/components/schemas/PreferenceSetRequest'
      description: Inline set preferences for a recipient, where the key is the preference set id. Preferences that are set inline will be merged into any existing preferences rather than replacing them.
      example:
        default:
          categories:
            transactional:
              channel_types:
                email: false
          channel_types:
            email: true
      title: InlinePreferenceSetRequest
      type: object
    MsTeamsIncomingWebhookConnection:
      description: Microsoft Teams incoming webhook connection.
      example:
        incoming_webhook:
          url: https://example.com/webhook
        knock_tenant_id: starfleet
      properties:
        incoming_webhook:
          description: Microsoft Teams incoming webhook.
          properties:
            url:
              description: Microsoft Teams incoming webhook URL.
              example: https://example.com/webhook
              type: string
          required:
          - url
          type: object
        knock_tenant_id:
          description: An optional Knock tenant ID (`knock_tenant_id`) that scopes this connection. Distinct from provider-specific tenant IDs. When a workflow is triggered with this tenant, Knock prefers this connection over untagged connections.
          example: starfleet
          type:
          - string
          - 'null'
      required:
      - incoming_webhook
      title: MsTeamsIncomingWebhookConnection
      type: object
    PreferenceSetRequest:
      description: A request to set a preference set for a recipient.
      example:
        __persistence_strategy__: merge
        categories:
          marketing: false
          transactional:
            channel_types:
              email: false
        channel_types:
          email: true
        channels:
          2f641633-95d3-4555-9222-9f1eb7888a80:
            conditions:
            - argument: US
              operator: equal_to
              variable: recipient.country_code
          aef6e715-df82-4ab6-b61e-b743e249f7b6: true
        commercial_subscribed: true
        workflows:
          dinosaurs-loose:
            channel_types:
              email: false
      properties:
        __persistence_strategy__:
          description: Controls how the preference set is persisted. 'replace' will completely replace the preference set, 'merge' will merge with existing preferences.
          enum:
          - merge
          - replace
          type: string
        categories:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PreferenceSetWorkflowCategorySetting'
            description: An object where the key is the category and the values are the preference settings for that category.
            example:
              marketing:
                channel_types:
                  email: false
              transactional: true
            title: PreferenceSetRequestCategories
            type: object
          - {}
          description: An object where the key is the category and the values are the preference settings for that category.
        channel_types:
          anyOf:
          - $ref: '#/components/schemas/PreferenceSetChannelTypes'
          - {}
          description: An object where the key is the channel type and the values are the preference settings for that channel type.
        channels:
          anyOf:
          - $ref: '#/components/schemas/PreferenceSetChannels'
          - {}
          description: An object where the key is the channel ID and the values are the preference settings for that channel ID.
        commercial_subscribed:
          anyOf:
          - type: boolean
          - $ref: '#/components/schemas/PreferenceSetCommercialSubscribedSetting'
          - {}
          description: Whether the recipient is subscribed to commercial communications. When false, the recipient will not receive commercial workflow notifications. Can also be set to a settings object with conditions that are evaluated at notification send time.
        workflows:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PreferenceSetWorkflowCategorySetting'
            description: An object where the key is the workflow key and the values are the preference settings for that workflow.
            example:
              dinosaurs-loose:
                channel_types:
                  email: false
                  sms: true
              welcome-sequence: true
            title: PreferenceSetRequestWorkflows
            type: object
          - {}
          description: An object where the key is the workflow key and the values are the preference settings for that workflow.
      title: PreferenceSetRequest
      type: object
    ListTenantsResponse:
      description: A response containing a list of tenants.
      example:
        entries:
        - __typename: Tenant
          id: tenant_jp123
          name: Jurassic Park
          settings:
            branding:
              dark_icon_url: https://example.com/trex_silhouette_icon_dark.png
              dark_logo_url: https://example.com/amber_fossil_logo_dark.png
              dark_primary_color: '#FFFFFF'
              dark_primary_color_contrast: '#000000'
              icon_url: https://example.com/trex_silhouette_icon.png
              logo_url: https://example.com/amber_fossil_logo.png
              primary_color: '#DF1A22'
              primary_color_contrast: '#FFDE00'
            preference_set:
              categories:
                safety:
                  channel_types:
                    email: true
                    push: true
              channel_types:
                email: true
                in_app_feed: true
                push: true
              id: default
              workflows:
                park_alert:
                  channel_types:
                    email: true
                    push: true
        page_info:
          __typename: PageInfo
          after: null
          before: null
          page_size: 25
      properties:
        entries:
          description: A list of tenants.
          items:
            $ref: '#/components/schemas/Tenant'
          type: array
        page_info:
          $ref: '#/components/schemas/PageInfo'
      required:
      - entries
      - page_info
      title: ListTenantsResponse
      type: object
    Tenant:
      additionalProperties: true
      description: A tenant entity.
      example:
        __typename: Tenant
        id: tenant_jp123
        name: Jurassic Park
        settings:
          branding:
            dark_icon_url: https://example.com/trex_silhouette_icon_dark.png
            dark_logo_url: https://example.com/amber_fossil_logo_dark.png
            dark_primary_color: '#FFFFFF'
            dark_primary_color_contrast: '#000000'
            icon_url: https://example.com/trex_silhouette_icon.png
            logo_url: https://example.com/amber_fossil_logo.png
            primary_color: '#DF1A22'
            primary_color_contrast: '#FFDE00'
          preference_set:
            categories:
              safety:
                channel_types:
                  email: true
                  push: true
            channel_types:
              email: true
              in_app_feed: true
              push: true
            id: default
            workflows:
              park_alert:
                channel_types:
                  email: true
                  push: true
      properties:
        __typename:
          description: The typename of the schema.
          example: Tenant
          type: string
        id:
          description: The unique identifier for the tenant.
          type: string
        name:
          description: An optional name for the tenant.
          type:
          - string
          - 'null'
        settings:
          description: The settings for the tenant. Includes branding and preference set.
          properties:
            branding:
              description: The branding for the tenant.
              properties:
                dark_icon_url:
                  description: The icon URL for the tenant in dark mode. Falls back to `icon_url` if unset.
                  example: https://example.com/trex_silhouette_icon_dark.png
                  format: uri
                  type:
                  - string
                  - 'null'
                dark_logo_url:
                  description: The logo URL for the tenant in dark mode. Falls back to `logo_url` if unset.
                  example: https://example.com/amber_fossil_logo_dark.png
                  format: uri
                  type:
                  - string
                  - 'null'
                dark_primary_color:
                  description: The primary color for the tenant in dark mode, provided as a hex value. Defaults to `#FFFFFF`.
                  example: '#FFFFFF'
                  type:
                  - string
                  - 'null'
                dark_primary_color_contrast:
                  description: The primary color contrast for the tenant in dark mode, provided as a hex value. Defaults to `#000000`.
                  example: '#000000'
                  type:
                  - string
                  - 'null'
                icon_url:
                  description: The icon URL for the tenant. Must point to a valid image with an image MIME type.
                  example: https://example.com/trex_silhouette_icon.png
                  format: uri
