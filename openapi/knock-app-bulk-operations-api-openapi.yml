            type: object
            x-struct: null
            x-validate: null
          type: array
          x-struct: null
          x-validate: null
        token:
          description: A Slack connection token.
          example:
            access_token: xoxb-1234567890
          properties:
            access_token:
              description: A Slack access token.
              example: xoxb-1234567890
              type:
              - string
              - 'null'
              x-struct: null
              x-validate: null
          required:
          - access_token
          title: SlackChannelDataTokenObject
          type:
          - object
          - 'null'
          x-struct: null
          x-validate: null
